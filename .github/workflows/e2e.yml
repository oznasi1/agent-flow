name: E2E (real host)

# The heavy lane, per the spec's Model B: it runs at merge-to-main, on demand
# (workflow_dispatch), and on any PR that asks for the real-host proof by
# carrying the `e2e` label — never on every PR; the fast lane in ci.yml gates
# those. Deliberately NOT a required check yet: the lane is proven on macOS
# locally, and this job is how the Linux/xvfb variant earns that status. Flip
# it to required only after it has been boringly green here.
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  e2e:
    # For the labeled event, run only when the label just added IS `e2e` —
    # each labeling is one deliberate request for a run (remove + re-add to
    # re-run), and other labels never wake the heavy lane.
    if: github.event_name != 'pull_request' || github.event.label.name == 'e2e'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Cache the pinned VS Code build
        uses: actions/cache@v4
        with:
          path: .vscode-test
          # The pin lives in test-e2e/_helpers/host.ts (VSCODE_VERSION);
          # hashing the file re-downloads exactly when the pin moves.
          key: vscode-test-${{ runner.os }}-${{ hashFiles('test-e2e/_helpers/host.ts') }}
      # A real Electron workbench needs a display; xvfb provides one headlessly.
      - run: xvfb-run -a npm run test:e2e
      # Layer C: the verify-feature report is generated on every run — pass or
      # fail — because it is the evidence, not the gate. The markdown summary
      # lands on the run page; the screenshot-strip HTML rides as an artifact.
      - name: Verify-feature report
        if: always()
        run: |
          npm run e2e:report
          cat test-results/verify-report.md >> "$GITHUB_STEP_SUMMARY"
      # On a labeled PR run, the same summary lands as ONE sticky comment,
      # updated in place on every run — no comment spam. Text-only by design:
      # GitHub strips data: URIs from comments, so the screenshot strip cannot
      # inline here; the comment links to the run's artifact instead.
      - name: Sticky PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker='<!-- agent-flow-verify-report -->'
          {
            echo "$marker"
            echo
            cat test-results/verify-report.md
            echo
            echo "_Screenshot-strip report: the \`verify-report\` artifact on [this run]($RUN_URL)._"
          } > /tmp/comment.md
          existing=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" \
            --jq "[.[] | select(.body | startswith(\"$marker\")) | .id][0] // empty")
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$existing" -F body=@/tmp/comment.md
          else
            gh api "repos/${{ github.repository }}/issues/$PR/comments" -F body=@/tmp/comment.md
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-report
          path: test-results/verify-report.html
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-e2e-report
          path: |
            playwright-e2e-report/
            test-results/
          retention-days: 7
