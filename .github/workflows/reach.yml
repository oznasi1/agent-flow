name: reach

on:
  schedule:
    # 06:17 UTC daily. An odd minute avoids the top-of-hour scheduling crush.
    - cron: "17 6 * * *"
  workflow_dispatch:

# Never part of the CI gate — this workflow must not be able to block a PR.
permissions:
  contents: write
  # For the health issue below. The built-in token is enough for this one —
  # only the traffic endpoints need the PAT.
  issues: write

concurrency:
  group: reach
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # A hung network call would otherwise bottom out at GitHub's 360-minute
    # default, holding the `reach` concurrency group against the next run.
    timeout-minutes: 10
    steps:
      - name: Check out main (for the collector scripts)
        uses: actions/checkout@v4

      - name: Check out the data branch
        uses: actions/checkout@v4
        with:
          ref: reach-data
          path: .reach-data

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No `npm ci` — the collector has zero dependencies by design.
      - name: Collect
        env:
          # The privileged token, spent ONLY on the traffic endpoints.
          # RESOLVED 2026-08-22 by a live run: the built-in GITHUB_TOKEN is NOT
          # sufficient — it 403s on all four traffic endpoints. REACH_TOKEN must
          # be a fine-grained PAT on this repo with `Administration: read`.
          # The fallback remains so a fork without the secret still collects
          # what it can rather than failing outright. See docs/REACH.md.
          GH_TOKEN: ${{ secrets.REACH_TOKEN || github.token }}
          # The public-read endpoints (/stargazers) use the built-in token, not
          # the PAT. The traffic endpoints need `Administration: read`, which
          # the built-in token lacks; a PAT scoped to exactly that cannot read
          # /stargazers. Routing them separately means the PAT never needs a
          # permission beyond Administration. Both 403s were observed live.
          GH_PUBLIC_TOKEN: ${{ github.token }}
        run: node scripts/reach/collect.mjs --out .reach-data

      - name: Render the dashboard
        # Runs even if a source failed: the sources that succeeded were written.
        if: always()
        run: node scripts/reach/render.mjs --data .reach-data --out .reach-data/index.html

      - name: Commit the day's data
        if: always()
        working-directory: .reach-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "reach: nothing changed" && exit 0
          git commit -m "chore(reach): $(date -u +%Y-%m-%d)"
          git push origin reach-data

      # A red run in the Actions tab is only a signal if somebody looks, and
      # the failure this guards against is exactly the kind nobody looks for.
      # One tracking issue is durable, lands where the work already is, and is
      # closed by the next good run so it can never sit there lying.
      #
      # This cannot catch the other failure mode — a cron that never fires at
      # all produces no run and therefore no step. That one is caught in the
      # viewer's browser by the dashboard's staleness banner. See docs/REACH.md.
      - name: Open or update the health issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The \`reach\` workflow failed: $RUN_URL"
            echo
            echo "Sources that did succeed were still written and committed — the store is"
            echo "not corrupt, it is incomplete. But GitHub only retains 14 days of daily"
            echo "traffic, so every day this stays red is a day of views and clones that"
            echo "cannot be recovered later."
            echo
            echo "First thing to check: REACH_TOKEN. It is a fine-grained PAT needing"
            echo "Administration: read, and it expires."
            echo
            echo "This issue closes itself on the next successful run."
          } > "$RUNNER_TEMP/reach-issue.md"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title \
            --jq '[.[] | select(.title == "reach: the collector is failing")][0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" \
              --body-file "$RUNNER_TEMP/reach-issue.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "reach: the collector is failing" \
              --body-file "$RUNNER_TEMP/reach-issue.md"
          fi

      - name: Close the health issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title \
            --jq '[.[] | select(.title == "reach: the collector is failing")][0].number // empty')
          if [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
              --comment "Recovered: $RUN_URL"
          fi
