name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The suite's heaviest file, test/unit/deckView.test.ts, peaks a single vitest
      # worker just under Node's default 4 GB old-space ceiling, so adding tests to it
      # kills the worker with a heap OOM rather than a failure — "Worker exited
      # unexpectedly", one file short of the count. A ceiling with headroom is a cheaper
      # gate than a size limit on that file; the real fix is for it to retain less.
      - run: npm test
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ct
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-ct-report
          path: playwright-report/
          retention-days: 7
      - run: npm run build
