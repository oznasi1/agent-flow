name: Sabotage (mutation-check the E2E lane)

# Weekly, not per-PR: it rebuilds and re-runs per patch, far too slow for a
# required check, and "a journey stopped being able to fail" is a
# standing-health question rather than a merge-blocking one.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  sabotage:
    runs-on: ubuntu-latest
    # Each patch rebuilds and runs one journey spec with CI retries:1
    # (playwright-e2e.config.ts) — a target test that fails via a multi-minute
    # expect-timeout is doubled by the retry, so a journey averages ~4 minutes
    # and the slowest take 13. One job ran out its 90-minute timeout 22 patches
    # into 38 (2026-10-06), so the lane is split round-robin across shards
    # (SABOTAGE_SHARD in scripts/sabotage.mjs): ~7 patches, ~30 minutes each.
    # fail-fast is off so one vacuous journey does not hide the other shards'.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    name: sabotage (${{ matrix.shard }}/6)
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Cache the pinned VS Code build
        uses: actions/cache@v6
        with:
          path: .vscode-test
          # Kept in sync with the same key in e2e.yml — the pins live in
          # test-e2e/_helpers/host.ts (VSCODE_VERSION), claudeCode.ts
          # (CLAUDE_CODE_VERSION), and copilotChat.ts (COPILOT_CHAT_VERSION);
          # hashing all three re-downloads exactly when any pin moves.
          key: vscode-test-${{ runner.os }}-${{ hashFiles('test-e2e/_helpers/host.ts', 'test-e2e/_helpers/claudeCode.ts', 'test-e2e/_helpers/copilotChat.ts') }}
      # A real Electron workbench needs a display; xvfb provides one headlessly.
      - run: xvfb-run -a npm run sabotage
        env:
          SABOTAGE_SHARD: ${{ matrix.shard }}/6
